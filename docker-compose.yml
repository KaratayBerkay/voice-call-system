services:
  turn:
    image: coturn/coturn
    network_mode: host
    restart: unless-stopped
    env_file: ./coturn/.env
    command:
      - -n
      - --log-file=stdout
      - --listening-ip=${TURN_LISTENING_IP}
      - --relay-ip=${TURN_RELAY_IP}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --lt-cred-mech
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --realm=${TURN_REALM:-voicecall.local}

  backend:
    build: ./nestjs-backend
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=3001

  web:
    build:
      context: ./web-voice-call-client
      args:
        # Override with a public https:// origin (proxied to this same
        # backend on /socket.io) once one is available -- see the "Microphone
        # access needs a secure context" note in README.md. Falls back to the
        # plain-http LAN address for local-only testing.
        VITE_SIGNALING_URL: ${PUBLIC_SIGNALING_URL:-http://${TURN_EXTERNAL_IP}:3001}
        VITE_TURN_URL: turn:${TURN_EXTERNAL_IP}:${TURN_PORT:-3478}
        VITE_TURN_USERNAME: ${TURN_USERNAME}
        VITE_TURN_PASSWORD: ${TURN_PASSWORD}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PORT=3002
